{% extends 'base_login.html' %}
{% load static %}

{% block title %}Nueva Contraseña{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/nueva_contraseña.css' %}">
{% endblock %}

{% block content %}
    <h2 class="auth-title">NUEVA CONTRASEÑA</h2>
    <p class="auth-subtitle">Ingresa tu nueva contraseña para acceder a tu cuenta.</p>

    <form method="post" action="" novalidate id="login-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="new_password" class="form-label">Nueva contraseña</label>
            <div class="input-wrapper">
                <span class="input-icon-left text-emerald-400">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" name="new_password" id="new_password" required placeholder="••••••••" class="form-input">
                <span class="input-icon-right">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>
        </div>

        <div class="form-group">
            <label for="confirm_password" class="form-label">Confirmar nueva contraseña</label>
            <div class="input-wrapper">
                <span class="input-icon-left text-emerald-400">
                    <i class="fa-solid fa-lock"></i>
                </span>
                <input type="password" name="confirm_password" id="confirm_password" required placeholder="••••••••" class="form-input">
                <span class="input-icon-right">
                    <i class="fa-solid fa-eye"></i>
                </span>
            </div>
        </div>

        <button type="submit" class="btn-primary">
            ACTUALIZAR CONTRASEÑA
        </button>
    </form>

    <div class="auth-footer">
        <a href="{% url 'password_request' %}" class="back-link">
            <i class="fa-solid fa-arrow-left"></i> Volver a verificación
        </a>
    </div>
{% endblock %}
