<div class="relative">
    <select id="filtro-precio" name="precio" class="hidden">
        <option value="">Rango de precio</option>
        <option value="hasta-50000" {% if precio_seleccionado == 'hasta-50000' %}selected{% endif %}>Hasta $ 50.000</option>
        <option value="50000-80000" {% if precio_seleccionado == '50000-80000' %}selected{% endif %}>$ 50.000 - $ 80.000</option>
        <option value="mas-80000" {% if precio_seleccionado == 'mas-80000' %}selected{% endif %}>Más de $ 80.000</option>
    </select>
    <button id="filtro-precio-boton" type="button" aria-haspopup="listbox" aria-expanded="false" class="flex min-h-12 w-full items-center gap-3 rounded-full border border-slate-200 bg-white px-4 text-left text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:border-emerald-500 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-emerald-600/30">
        <i class="fa-solid fa-wallet text-emerald-700" aria-hidden="true"></i>
        <span class="min-w-0 flex-1 truncate text-sm font-medium">{% if precio_seleccionado == 'hasta-50000' %}Hasta $ 50.000{% elif precio_seleccionado == '50000-80000' %}$ 50.000 - $ 80.000{% elif precio_seleccionado == 'mas-80000' %}Más de $ 80.000{% else %}Rango de precio{% endif %}</span>
        <i class="fa-solid fa-chevron-down text-xs text-slate-500 transition-transform" aria-hidden="true"></i>
    </button>
    <div id="filtro-precio-menu" role="listbox" aria-label="Rango de precio" class="absolute left-0 top-full z-30 mt-2 hidden w-full min-w-52 overflow-hidden rounded-2xl border border-slate-100 bg-white p-2 shadow-xl shadow-slate-950/15">
        <button type="button" role="option" aria-selected="{% if not precio_seleccionado %}true{% else %}false{% endif %}" data-value="" data-label="Rango de precio" class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm transition hover:bg-emerald-50 hover:text-emerald-800 {% if not precio_seleccionado %}bg-emerald-50 font-semibold text-emerald-800{% else %}text-slate-700{% endif %}">
            Cualquier precio <i class="fa-solid fa-check text-xs {% if precio_seleccionado %}invisible{% endif %}" aria-hidden="true"></i>
        </button>
        <button type="button" role="option" aria-selected="{% if precio_seleccionado == 'hasta-50000' %}true{% else %}false{% endif %}" data-value="hasta-50000" data-label="Hasta $ 50.000" class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm transition hover:bg-emerald-50 hover:text-emerald-800 {% if precio_seleccionado == 'hasta-50000' %}bg-emerald-50 font-semibold text-emerald-800{% else %}text-slate-700{% endif %}">
            Hasta $ 50.000 <i class="fa-solid fa-check text-xs {% if precio_seleccionado != 'hasta-50000' %}invisible{% endif %}" aria-hidden="true"></i>
        </button>
        <button type="button" role="option" aria-selected="{% if precio_seleccionado == '50000-80000' %}true{% else %}false{% endif %}" data-value="50000-80000" data-label="$ 50.000 - $ 80.000" class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm transition hover:bg-emerald-50 hover:text-emerald-800 {% if precio_seleccionado == '50000-80000' %}bg-emerald-50 font-semibold text-emerald-800{% else %}text-slate-700{% endif %}">
            $ 50.000 - $ 80.000 <i class="fa-solid fa-check text-xs {% if precio_seleccionado != '50000-80000' %}invisible{% endif %}" aria-hidden="true"></i>
        </button>
        <button type="button" role="option" aria-selected="{% if precio_seleccionado == 'mas-80000' %}true{% else %}false{% endif %}" data-value="mas-80000" data-label="Más de $ 80.000" class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm transition hover:bg-emerald-50 hover:text-emerald-800 {% if precio_seleccionado == 'mas-80000' %}bg-emerald-50 font-semibold text-emerald-800{% else %}text-slate-700{% endif %}">
            Más de $ 80.000 <i class="fa-solid fa-check text-xs {% if precio_seleccionado != 'mas-80000' %}invisible{% endif %}" aria-hidden="true"></i>
        </button>
    </div>
</div>
