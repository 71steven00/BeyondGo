{% load static %}

<nav id="main-nav"

   <!-- 3. Logotipo derecho -->
    <div class="pointer-events-auto flex items-center">
            <img src="{% static 'icons/logo.ico' %}" alt="BeyondGo" class="h-16 md:h-20 w-auto object-contain">
        </a>
    </div>

    <!-- 2. Píldora de navegación central -->

        <div

            <!-- Inicio -->
            <a href="{% url 'inicio' %}"

            <!-- Hospedaje -->
            <a href="{% url 'hospedaje' %}"

                <span>Hospedaje</span>
            </a>

            <!-- Restaurantes -->
            <a href="{% url 'restaurantes' %}"
                class="flex items-center gap-2 px-5 py-2.5 rounded-full transition {% if request.resolver_match.url_name == 'restaurantes' %}bg-white/20 font-semibold text-white shadow-sm{% else %}text-white/80 hover:text-white hover:bg-white/10{% endif %}">
                <i class="fa-solid fa-utensils text-xs"></i>
                <span>Restaurantes</span>
            </a>

            <!-- Experiencias -->
            <a href="{% url 'experiencias' %}"
                class="flex items-center gap-2 px-5 py-2.5 rounded-full transition {% if request.resolver_match.url_name == 'experiencias' %}bg-white/20 font-semibold text-white shadow-sm{% else %}text-white/80 hover:text-white hover:bg-white/10{% endif %}">

                <span>Experiencias</span>
            </a>

            <!-- Hazte Miembro -->
            <a href="{% url 'hazte_miembro' %}"
                class="flex items-center gap-2 px-5 py-2.5 rounded-full transition {% if request.resolver_match.url_name == 'hazte_miembro' %}bg-white/20 font-semibold text-white shadow-sm{% else %}text-white/80 hover:text-white hover:bg-white/10{% endif %}">
                <span>Hazte Miembro</span>

        </div>
    </div>

        <!-- 1. Botón izquierdo: Inicio de sesión -->
        <div class="pointer-events-auto flex items-center">

        <a href="#"
            class="flex items-center gap-2.5 px-5 py-2.5 rounded-full border border-white/80 bg-black/50 backdrop-blur-md text-white text-sm font-semibold hover:text-white hover:bg-white/10 transition">
                <i class="fa-regular fa-user text-base"></i>
            <span>Hazte Guía</span>
        </a>
            
            {% if user.is_authenticated %}
                <a href="{% url 'perfil' %}"
                    class="flex items-center gap-2.5 px-4 py-2 rounded-full border border-white/80 bg-black/50 backdrop-blur-md text-white text-sm font-semibold hover:text-white hover:bg-white/10 transition {% if request.resolver_match.url_name == 'perfil' %}bg-white/20{% endif %}">
                        <span class="flex items-center justify-center w-7 h-7 rounded-full bg-[#2ec4b6] text-white text-[11px] font-bold uppercase">
                            {{ user.first_name|slice:":1" }}{{ user.last_name|slice:":1" }}
                        </span>
                    <span>Mi Perfil</span>
                </a>
            {% else %}
                <a href="{% url 'login' %}"
                    class="flex items-center gap-2.5 px-5 py-2.5 rounded-full border border-white/80 bg-black/50 backdrop-blur-md text-white text-sm font-semibold hover:text-white hover:bg-white/10 transition">
                        <i class="fa-regular fa-user text-base"></i>
                    <span>Inicio de sesión</span>
                </a>
            {% endif %}
        </div>
</nav>

<!-- Script para oscurecer el fondo al hacer scroll -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const nav = document.getElementById('main-nav');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 30) {
                // Al bajar más de 30px, se aplica un fondo oscuro elegante con desenfoque y sombra
                nav.classList.add('bg-slate-950/80', 'backdrop-blur-md', 'shadow-2xl', 'py-3');
                nav.classList.remove('py-5');
            } else {
                // Al regresar a la parte superior, vuelve a su estado transparente original
                nav.classList.remove('bg-slate-950/80', 'backdrop-blur-md', 'shadow-2xl', 'py-3');
                nav.classList.add('py-5');
            }
        });
    });
</script>
