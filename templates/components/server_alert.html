{% if messages %}
<div class="fixed top-6 right-14 z-50 w-full max-w-sm px-4 space-y-2 pointer-events-none">
    {% for message in messages %}
        <div x-data="{ show: true }"
             x-init="setTimeout(() => show = false, 4000)"
             x-show="show"
             x-transition:leave="transition ease-in duration-500"
             x-transition:leave-start="opacity-100 transform translate-y-0"
             x-transition:leave-end="opacity-0 transform -translate-y-2"
             class="pointer-events-auto rounded-2xl p-3.5 shadow-xl flex items-center gap-3 text-xs font-semibold border backdrop-blur-sm
                {% if 'success' in message.tags %}
                    bg-emerald-50/95 border-emerald-200 text-emerald-800
                {% elif 'error' in message.tags or 'danger' in message.tags or 'warning' in message.tags %}
                    bg-rose-50/95 border-rose-200 text-rose-800
                {% else %}
                    bg-slate-50/95 border-slate-200 text-slate-800
                {% endif %}">
            
            <div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-xs font-bold text-white
                {% if 'success' in message.tags %} bg-emerald-600 
                {% elif 'error' in message.tags or 'danger' in message.tags or 'warning' in message.tags %} bg-rose-600 
                {% else %} bg-slate-600 {% endif %}">
                
                {% if 'success' in message.tags %} ✓ 
                {% else %} ! {% endif %}
            </div>

            <span class="flex-1">{{ message }}</span>
        </div>
    {% endfor %}
</div>
{% endif %}
